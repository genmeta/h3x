[package]
name = "h3x-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
h3x = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "fuzz_frame"
path = "fuzz_targets/fuzz_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_field_section"
path = "fuzz_targets/fuzz_field_section.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_qpack_integer"
path = "fuzz_targets/fuzz_qpack_integer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_qpack_string"
path = "fuzz_targets/fuzz_qpack_string.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_qpack_instruction"
path = "fuzz_targets/fuzz_qpack_instruction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_goaway"
path = "fuzz_targets/fuzz_goaway.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_unidirectional_stream"
path = "fuzz_targets/fuzz_unidirectional_stream.rs"
test = false
doc = false
bench = false
