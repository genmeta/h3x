[package]
name = "h3x"
description = "HTTP/3 message, frame, and stream primitives"
version = "0.6.2"
edition = "2024"
readme = "README.md"
repository = "https://github.com/genmeta/h3x"
license = "Apache-2.0"
keywords = ["async", "quic", "http3"]
categories = ["network-programming", "asynchronous"]

[dependencies]
async-trait = "0.1"
bytes = "1"
http = "1"
httlib-huffman = "0.3"
thiserror = "2"
qbase = { version = "0.6.4", path = "../dquic/qbase" }
qrecovery = { version = "0.6.2", path = "../dquic/qrecovery" }
tokio = { version = "1", features = ["macros", "rt", "io-util", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["time", "net"] }
futures-util = { version = "0.3", features = ["sink"] }
httparse = "1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
