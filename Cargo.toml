[package]
name = "h3x"
description = "Symmetric HTTP/3 protocol over an established QUIC connection"
version = "0.6.2"
edition = "2024"
readme = "README.md"
repository = "https://github.com/genmeta/h3x"
license = "Apache-2.0"
keywords = ["async", "quic", "http3"]
categories = ["network-programming", "asynchronous"]

[dependencies]
bytes = "1"
futures = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
httlib-huffman = "0.3"
qbase = "0.6.4"
tokio = { version = "1", features = ["macros", "rt", "sync"] }

[features]
default = []
webtransport = []
fuzzing = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util"] }
