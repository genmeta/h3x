[package]
name = "h3x"
description = "HTTP/3 message, frame, and stream primitives"
version = "0.6.2"
edition = "2024"
readme = "README.md"
repository = "https://github.com/genmeta/h3x"
license = "Apache-2.0"
keywords = ["async", "quic", "http3"]
categories = ["network-programming", "asynchronous"]

[lib]
test = true
doctest = false

[dependencies]
async-trait = "0.1"
bytes = "1"
dashmap = "6"
futures = "0.3"
http = "1"
httlib-huffman = "0.3"
thiserror = "2"
qbase = "0.6.4"
qrecovery = "0.6.2"
tokio = { version = "1", features = ["macros", "rt", "io-util", "sync", "time"] }

[dev-dependencies]
http-body = "1"
http-body-util = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
wasmtime = "48"
wasmtime-wasi = { version = "47", features = ["p2"] }
wasmtime-wasi-http = { version = "47", features = ["p2"] }
