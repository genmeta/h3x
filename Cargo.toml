[package]
name = "h3x"
description = "Symmetric HTTP/3 protocol over an established QUIC connection"
version = "0.6.2"
edition = "2024"
readme = "README.md"
repository = "https://github.com/genmeta/h3x"
license = "Apache-2.0"
keywords = ["async", "quic", "http3"]
categories = ["network-programming", "asynchronous"]

[dependencies]
bytes = "1"
dquic = { version = "0.7.2", default-features = false }
futures = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
httlib-huffman = "0.3"
nom = "8"
qbase = "0.6.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
dhttp-identity = "0.3.0"
x509-parser = { version = "0.18", features = ["verify"] }
x509-ocsp = "0.2.1"
der = "0.7"
ring = "0.17"
tower-service = "0.3"
tokio = { version = "1", features = ["macros", "rt", "sync", "io-util", "time"] }

[features]
default = []
webtransport = []
fuzzing = []

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1", features = ["macros", "rt", "sync", "test-util"] }
